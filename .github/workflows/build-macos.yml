name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: macOS quality gates
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/wf-bridge/go.mod

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend and unit tests
        run: npm test

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Test WF bridge
        working-directory: sidecars/wf-bridge
        run: go test -tags wfbridge ./...

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check --locked --all-targets

  build-macos:
    needs: quality
    name: macOS ${{ matrix.arch }} DMG installer
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/wf-bridge/go.mod

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build XIASS DMG installer
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles dmg --ci

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: XIASS-Tools-macOS-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

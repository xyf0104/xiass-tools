name: Build macOS

on:
  workflow_dispatch:
    inputs:
      publish_existing_tag:
        description: 'Optional: publish installers from completed runs for this tag (skips rebuilding)'
        required: false
        default: ''
      macos_run_id:
        description: 'Successful macOS run ID for the tag'
        required: false
        default: ''
      windows_run_id:
        description: 'Successful Windows run ID for the tag'
        required: false
        default: ''
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    if: ${{ !inputs.publish_existing_tag }}
    name: macOS quality gates
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/wf-bridge/go.mod

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend and unit tests
        run: npm test

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

      - name: Test WF bridge
        working-directory: sidecars/wf-bridge
        run: go test -tags wfbridge ./...

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check --locked --all-targets

  build-macos:
    needs: quality
    name: macOS ${{ matrix.arch }} DMG installer
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/wf-bridge/go.mod

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build XIASS DMG installer
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles dmg --ci

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: XIASS-Tools-macOS-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish-existing-installers:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing_tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: release-${{ inputs.publish_existing_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source runs and publish their installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish_existing_tag }}
          MACOS_RUN_ID: ${{ inputs.macos_run_id }}
          WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
        run: node scripts/publish-ci-installers.mjs

name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/wf-bridge/go.mod
      - run: npm ci
      - run: npm test
      - working-directory: src-tauri
        run: cargo test --locked
      - name: Test WF bridge
        working-directory: sidecars/wf-bridge
        run: go test -tags wfbridge ./...

  build:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/wf-bridge/go.mod
      - run: npm ci
      - name: Build XIASS Windows installer
        run: npm run tauri:build -- --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: XIASS-Tools-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
